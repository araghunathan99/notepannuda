<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#F3F5F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161A21" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NotePannuda">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="favicon-16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>NotePannuda</title>
<style>
:root{ accent-color:#1F5F8B;
  --paper:#F3F5F8; --surface:#FFFFFF; --ink:#1B2230; --graphite:#5A6372; --faint:#8C94A3;
  --rule:#DCE1E8; --rule-strong:#C3CAD5; --accent:#1F5F8B; --accent-soft:#E3EEF6;
  --marker:#FFE36B; --high:#C8412C; --med:#C98300; --low:#3C78B0; --ok:#2E7D5B;
  --serif:"Iowan Old Style","Charter","Palatino Linotype",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --paper:#161A21; --surface:#1E232C; --ink:#E6E9EE; --graphite:#A9B1BE; --faint:#7B8493;
    --rule:#2C333E; --rule-strong:#3A4350; --accent:#79B3DD; --accent-soft:#1F3344; --marker:#6B5B12;
    --high:#F07A64; --med:#E6AC3C; --low:#78AEE0; --ok:#5CC08F; }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
